<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo 2D - Vitória ao Encostar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 25px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(0, 230, 118, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    canvas {
      border: 3px solid #3d3d5c;
      border-radius: 8px;
      background: #10101a;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .controls-panel {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 15px;
    }

    .card {
      padding: 12px 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      text-align: center;
      border-left: 4px solid #00e676;
    }

    .card h2 {
      font-size: 15px;
      margin-bottom: 5px;
      color: #00e676;
    }

    kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      box-shadow: 0 2px 0 #111;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Fase Expandida - Vitória ao Encostar</h1>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-panel">
      <div class="card">
        <h2>Jogador 1</h2>
        <p><kbd>A</kbd> Esquerda | <kbd>D</kbd> Direita | <kbd>W</kbd> Pulo</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const WORLD_WIDTH = 2400; 
    const FLOOR_Y = 340;      
    let cameraX = 0;          
    let gameWon = false; // Estado de vitória
    const keys = {};

    // =========================================================
    // 🖼️ CAMINHOS DAS IMAGENS
    // =========================================================
    const CAMINHO_BACKGROUND  = 'palacio.webp';       
    const CAMINHO_P1_IDLE     = 'images.jpeg';    
    const CAMINHO_P1_WALK     = 'lula andando.jpg'; 
    const CAMINHO_P2_STATIC   = 'pesca.jpg.webp'; 
    const CAMINHO_VITORIA     = 'lulinha.jpeg'; // 👈 SUA IMAGEM DE VITÓRIA AQUI

    const bgImage = new Image();
    bgImage.src = CAMINHO_BACKGROUND;

    const spriteP1Idle = new Image();
    spriteP1Idle.src = CAMINHO_P1_IDLE;

    const spriteP1Walk = new Image();
    spriteP1Walk.src = CAMINHO_P1_WALK;

    const spriteP2 = new Image();
    spriteP2.src = CAMINHO_P2_STATIC;

    const spriteVitoria = new Image();
    spriteVitoria.src = CAMINHO_VITORIA;

    const platforms = [
      { x: 250, y: 260, width: 140, height: 20 },
      { x: 480, y: 190, width: 160, height: 20 },
      { x: 750, y: 250, width: 150, height: 20 },
      { x: 1000, y: 180, width: 180, height: 20 },
      { x: 1300, y: 220, width: 220, height: 20 },
      { x: 1650, y: 160, width: 160, height: 20 },
      { x: 1950, y: 230, width: 200, height: 20 }
    ];

    const player1 = {
      x: 100,
      y: 280,
      width: 50,
      height: 50,
      color: '#00e676',
      vx: 0,
      vy: 0,
      speed: 5,
      gravity: 0.6,
      jumpForce: -12,
      grounded: false,
      isMoving: false,
      facing: 'right'
    };

    const player2 = {
      x: 1380,
      y: 220 - 50,
      width: 50,
      height: 50,
      color: '#00b0ff',
      facing: 'left'
    };

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Função de detecção de colisão por AABB (retângulos se cruzando)
    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    function updatePlayer1() {
      if (keys['a']) {
        player1.vx = -player1.speed;
        player1.isMoving = true;
        player1.facing = 'left';
      } else if (keys['d']) {
        player1.vx = player1.speed;
        player1.isMoving = true;
        player1.facing = 'right';
      } else {
        player1.vx = 0;
        player1.isMoving = false;
      }

      if (keys['w'] && player1.grounded) {
        player1.vy = player1.jumpForce;
        player1.grounded = false;
      }

      player1.vy += player1.gravity;
      player1.x += player1.vx;
      player1.y += player1.vy;

      player1.grounded = false;
      if (player1.y + player1.height >= FLOOR_Y) {
        player1.y = FLOOR_Y - player1.height;
        player1.vy = 0;
        player1.grounded = true;
      }

      platforms.forEach(plat => {
        const pBottom = player1.y + player1.height;
        const pNextBottom = pBottom + player1.vy;

        if (player1.x + player1.width > plat.x && player1.x < plat.x + plat.width) {
          if (pBottom <= plat.y + 10 && pNextBottom >= plat.y && player1.vy >= 0) {
            player1.y = plat.y - player1.height;
            player1.vy = 0;
            player1.grounded = true;
          }
        }
      });

      if (player1.x < 0) player1.x = 0;
      if (player1.x + player1.width > WORLD_WIDTH) {
        player1.x = WORLD_WIDTH - player1.width;
      }

      cameraX = player1.x - canvas.width / 2 + player1.width / 2;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > WORLD_WIDTH - canvas.width) {
        cameraX = WORLD_WIDTH - canvas.width;
      }

      // Checa colisão entre P1 e P2
      if (checkCollision(player1, player2)) {
        gameWon = true;
      }
    }

    function update() {
      updatePlayer1();
    }

    function drawPlayer(p, sprite) {
      ctx.save();
      if (sprite.complete && sprite.naturalWidth !== 0) {
        if (p.facing === 'left') {
          ctx.translate(p.x + p.width, p.y);
          ctx.scale(-1, 1);
          ctx.drawImage(sprite, 0, 0, p.width, p.height);
        } else {
          ctx.drawImage(sprite, p.x, p.y, p.width, p.height);
        }
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.width, p.height);
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- MUNDO COM ROLAGEM DA CÂMERA ---
      ctx.save();
      ctx.translate(-cameraX, 0);

      // 1. Fundo
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        for (let x = 0; x < WORLD_WIDTH; x += canvas.width) {
          ctx.drawImage(bgImage, x, 0, canvas.width, canvas.height);
        }
      } else {
        ctx.fillStyle = '#161625';
        ctx.fillRect(0, 0, WORLD_WIDTH, canvas.height);
      }

      // 2. Chão Principal
      ctx.fillStyle = '#222233';
      ctx.fillRect(0, FLOOR_Y, WORLD_WIDTH, canvas.height - FLOOR_Y);
      ctx.fillStyle = '#00e676';
      ctx.fillRect(0, FLOOR_Y, WORLD_WIDTH, 4);

      // 3. Plataformas Suspensas
      platforms.forEach(plat => {
        ctx.fillStyle = '#3d3d5c';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#00e676';
        ctx.fillRect(plat.x, plat.y, plat.width, 3);
      });

      // 4. Jogadores
      const currentP1Sprite = player1.isMoving ? spriteP1Walk : spriteP1Idle;
      drawPlayer(player1, currentP1Sprite);
      drawPlayer(player2, spriteP2);

      ctx.restore(); // Restaura câmera (elementos desenhados abaixo ficam fixos na tela)

      // --- OVERLAY DE VITÓRIA (TELA FIXA NO MEIO) ---
      if (gameWon) {
        const modalW = 450;
        const modalH = 270;
        const modalX = (canvas.width - modalW) / 2;
        const modalY = (canvas.height - modalH) / 2;

        // Fundo semitransparente escuro da tela
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Caixa do Popup
        ctx.fillStyle = 'rgba(20, 20, 32, 0.95)';
        ctx.fillRect(modalX, modalY, modalW, modalH);
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 3;
        ctx.strokeRect(modalX, modalY, modalW, modalH);

        // Texto em Comic Sans no topo do card
        ctx.font = 'bold 36px "Comic Sans MS", "Comic Sans", cursive, sans-serif';
        ctx.fillStyle = '#ffeb3b';
        ctx.textAlign = 'center';
        ctx.fillText('Parabéns!', canvas.width / 2, modalY + 50);

        // Imagem central do card
        const imgW = 260;
        const imgH = 150;
        const imgX = (canvas.width - imgW) / 2;
        const imgY = modalY + 80;

        if (spriteVitoria.complete && spriteVitoria.naturalWidth !== 0) {
          ctx.drawImage(spriteVitoria, imgX, imgY, imgW, imgH);
        } else {
          ctx.fillStyle = '#333355';
          ctx.fillRect(imgX, imgY, imgW, imgH);
          ctx.font = '14px sans-serif';
          ctx.fillStyle = '#aaaaaa';
          ctx.fillText('Espaço da Imagem de Vitória', canvas.width / 2, imgY + imgH / 2);
        }
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
